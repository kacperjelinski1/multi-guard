name: Build & Release Multi-Guard

on:
  push:
    branches:
      - main
      - clean-dashboard
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - clean-dashboard
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag name for manual release (e.g. v1.1.3.0)'
        required: false
        type: string
        default: 'v2.0.4.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Qt 5.15.2 & MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          setup-python: false

      - name: Verify Build Tools
        shell: pwsh
        run: |
          qmake -v
          g++ --version
          iscc /? | Select-Object -First 2

      - name: Compile Translations
        shell: pwsh
        run: |
          if (Test-Path i18n/verax_pl.ts) { lrelease i18n/verax_pl.ts -qm i18n/verax_pl.qm }

      - name: Build Multi-Guard
        shell: pwsh
        run: |
          qmake Verax.pro "CONFIG+=release"
          mingw32-make -j 2 release

      - name: Deploy Qt Runtime & Plugins (windeployqt)
        shell: pwsh
        run: |
          if (-not (Test-Path RELEASED/Multi-Guard.exe)) {
            Write-Error "RELEASED/Multi-Guard.exe was not created!"
            exit 1
          }
          strip RELEASED/Multi-Guard.exe
          $env:QT_PLUGIN_PATH = $null
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --no-translations --compiler-runtime RELEASED/Multi-Guard.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "windeployqt exited with code $LASTEXITCODE; proceeding with direct deployment verification..."
            $global:LASTEXITCODE = 0
          }
          # Defensively ensure critical Qt plugins and runtime files are present
          New-Item -ItemType Directory -Force -Path "RELEASED/platforms" | Out-Null
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/*" -Destination "RELEASED/platforms/" -Recurse -Force
          if (Test-Path "$env:QT_ROOT_DIR/plugins/imageformats") {
            New-Item -ItemType Directory -Force -Path "RELEASED/imageformats" | Out-Null
            Copy-Item "$env:QT_ROOT_DIR/plugins/imageformats/*" -Destination "RELEASED/imageformats/" -Recurse -Force
          }
          if (Test-Path "$env:QT_ROOT_DIR/plugins/sqldrivers") {
            New-Item -ItemType Directory -Force -Path "RELEASED/sqldrivers" | Out-Null
            Copy-Item "$env:QT_ROOT_DIR/plugins/sqldrivers/*" -Destination "RELEASED/sqldrivers/" -Recurse -Force
          }
          Copy-Item "$env:QT_ROOT_DIR/bin/Qt5*.dll" -Destination "RELEASED/" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:/mingw64/bin/libgcc_s_*.dll" -Destination "RELEASED/" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:/mingw64/bin/libstdc++-*.dll" -Destination "RELEASED/" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:/mingw64/bin/libwinpthread-*.dll" -Destination "RELEASED/" -Force -ErrorAction SilentlyContinue

          # Deploy OpenSSL 1.1.1 x64 TLS runtime for QtNetwork
          Write-Host "Deploying OpenSSL 1.1.1 x64 runtime DLLs..."
          if (Test-Path "third_party/openssl/libssl-1_1-x64.dll") {
            Copy-Item "third_party/openssl/libssl-1_1-x64.dll" -Destination "RELEASED/" -Force
            Copy-Item "third_party/openssl/libcrypto-1_1-x64.dll" -Destination "RELEASED/" -Force
          }
          if (-not (Test-Path "RELEASED/libssl-1_1-x64.dll") -or -not (Test-Path "RELEASED/libcrypto-1_1-x64.dll")) {
            Write-Error "CRITICAL: OpenSSL 1.1.1 DLLs missing from RELEASED! TLS network requests will fail."
            exit 1
          }
          Write-Host "OpenSSL 1.1.1 runtime DLLs verified successfully."
          Get-ChildItem -Path RELEASED

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path RELEASED_SETUP | Out-Null
          iscc installer/Multi-Guard.iss

      - name: Package Portable ZIP Archive
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem RELEASED_SETUP/Multi-Guard-Setup-*.exe | Select-Object -First 1
          $ver = if ($setupExe) { $setupExe.Name -replace 'Multi-Guard-Setup-','' -replace '\.exe','' } else { "1.1.2.0" }
          Compress-Archive -Path RELEASED\* -DestinationPath "RELEASED_SETUP/Multi-Guard-$ver-win64-portable.zip" -Force

      - name: Generate SHA256 Checksums
        shell: pwsh
        working-directory: RELEASED_SETUP
        run: |
          Get-FileHash -Algorithm SHA256 (Get-ChildItem Multi-Guard-Setup-*.exe, Multi-Guard-*-win64-portable.zip) | `
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | `
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Guard-Windows-x64
          path: RELEASED_SETUP/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.release_tag }}
          name: Multi-Guard ${{ github.ref_name != 'main' && github.ref_name || inputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            RELEASED_SETUP/Multi-Guard-Setup-*.exe
            RELEASED_SETUP/Multi-Guard-*-win64-portable.zip
            RELEASED_SETUP/SHA256SUMS.txt
