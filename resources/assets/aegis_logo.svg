<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer C-shaped stylized shield -->
  <g filter="url(#glow)">
    <!-- Left/Upper Wing -->
    <path d="M 50 10 C 26 10 12 30 12 50 C 12 70 26 90 50 90 C 38 82 28 68 28 50 C 28 32 38 18 50 10 Z" fill="url(#gradLeft)" />
    <!-- Inner faceted facet -->
    <path d="M 50 10 C 40 18 32 30 32 50 C 32 70 40 82 50 90 C 44 80 40 68 40 50 C 40 32 44 20 50 10 Z" fill="#38BDF8" opacity="0.6" />
    <!-- Right Upper Tip -->
    <path d="M 50 10 C 62 18 70 28 72 38 L 60 42 C 58 32 54 20 50 10 Z" fill="url(#gradRight)" />
    <!-- Right Lower Tip -->
    <path d="M 50 90 C 62 82 70 72 72 62 L 60 58 C 58 68 54 80 50 90 Z" fill="url(#gradRight)" />
  </g>
</svg>